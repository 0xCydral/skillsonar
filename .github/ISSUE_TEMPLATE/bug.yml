name: Bug report
description: Something is not working
labels: [bug, triage]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: The command you ran, what you expected and what you got.
    validations:
      required: true
  - type: input
    attributes:
      label: skillsonar version
      description: Output of `skillsonar --version`
    validations:
      required: true
  - type: input
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: textarea
    attributes:
      label: Output of `skillsonar stats`
      description: Optional. Helps when results look wrong.
