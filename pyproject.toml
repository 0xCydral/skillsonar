[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsonar"
version = "0.4.0"
description = "Find the right agent skill (SKILL.md) for a task: keyword index, optional embeddings and rerank."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Adrian Castellar" }]
keywords = ["agent-skills", "skills", "search", "claude-code", "opencode", "codex", "embeddings", "opencode-router"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/0xCydral/skillsonar"
Repository = "https://github.com/0xCydral/skillsonar"
Issues = "https://github.com/0xCydral/skillsonar/issues"
Changelog = "https://github.com/0xCydral/skillsonar/blob/main/CHANGELOG.md"

[project.scripts]
skillsonar = "skillsonar.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
